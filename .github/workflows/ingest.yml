# Public repo: self-hosted dfl-runner blocked (allows_public=false). Authorized Tainan TG 2026-06-06.
name: Skills ingest + audit

on:
  push:
    branches: [main]
    paths: ["skills/**", "scripts/ingest.ts", ".claude-plugin/marketplace.json"]
  pull_request:
    paths: ["skills/**", "scripts/ingest.ts", ".claude-plugin/marketplace.json"]
  workflow_dispatch: {}

jobs:
  audit:
    # On PRs: run the audit gate (DRY_RUN, AUDIT_BLOCK) — blocks merge on
    # high-risk injection/secret findings (Q10=A). Override with the
    # `skip-skill-audit` label.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Audit scan (gate)
        env:
          SKILLS_SOURCE: ${{ github.repository }}
          SKILLS_VISIBILITY: public
          DRY_RUN: "1"
          AUDIT_BLOCK: ${{ contains(github.event.pull_request.labels.*.name, 'skip-skill-audit') && '0' || '1' }}
        run: bun scripts/ingest.ts

  ingest:
    # On push to main (or manual re-trigger): parse + embed + upsert into the registry.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Ingest into dfl-skills registry
        env:
          SKILLS_SOURCE: ${{ github.repository }}
          SKILLS_VISIBILITY: public
          # The PR gate can be skipped by label; this one can't. Nothing reaches the
          # public site with high-risk findings.
          AUDIT_BLOCK: "1"
          SKILLS_INGEST_URL: ${{ vars.SKILLS_INGEST_URL }}
          SKILLS_INGEST_SECRET: ${{ secrets.SKILLS_INGEST_SECRET }}
          GITHUB_SHA: ${{ github.sha }}
        run: bun scripts/ingest.ts
